<!DOCTYPE html>
<html class="light" lang="en" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Tracking | V Meal</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: {
                "primary": "#FC8019", "background": "#ffffff", "surface": "#f9f9f9",
                "surface-container": "#eeeeee", "on-surface": "#1a1c1c",
                "outline": "#E9E9EB", "secondary-text": "#686B78",
                "success": "#60B246", "error-red": "#D83C3C",
            }}}
        }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .filled { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .kinetic-gradient { background: linear-gradient(135deg, #984800 0%, #FC8019 100%); }
        body { font-family: 'Inter', sans-serif; }
        .step-done .step-dot { background: #60B246 !important; }
        .step-done .step-dot .icon { color: white !important; }
        .step-active .step-dot { background: #FC8019 !important; box-shadow: 0 4px 12px rgba(252,128,25,0.3); }
        .step-active .step-dot .icon { color: white !important; }
        .step-active .step-label { color: #1a1c1c !important; font-weight: 700 !important; }
        .step-done .step-label { color: #60B246 !important; }
        .step-done .step-line { background: #60B246 !important; }
    </style>
</head>
<body class="bg-background text-on-surface pb-24">

<header class="fixed top-0 w-full z-50 bg-white/90 backdrop-blur-xl border-b border-outline">
    <div class="flex justify-between items-center px-6 py-4 max-w-7xl mx-auto">
        <div class="flex items-center gap-3">
            <button onclick="window.location.href='dash.html'" class="p-2 rounded-full hover:bg-surface-container transition-colors">
                <span class="material-symbols-outlined">arrow_back</span>
            </button>
            <img src="1766987781692.png" class="h-7 w-auto" alt="V Meal"/>
        </div>
    </div>
</header>

<main class="pt-24 pb-10 px-4 max-w-4xl mx-auto">
    <div class="mb-8">
        <h1 class="text-2xl font-extrabold tracking-tight mb-3" id="orderTitle">Order #—</h1>
        <div class="inline-flex items-center gap-3 bg-primary/5 rounded-xl px-4 py-3" id="etaBlock">
            <span class="material-symbols-outlined text-primary">timer</span>
            <div>
                <p class="text-xs text-secondary-text uppercase font-bold tracking-wider">Estimated Time</p>
                <p class="text-lg font-black text-primary" id="etaValue">Waiting...</p>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- Stepper -->
        <div class="lg:col-span-7">
            <div class="bg-surface rounded-2xl p-8 border border-outline">
                <h2 class="text-xs uppercase tracking-widest font-bold text-secondary-text mb-10">Track Progress</h2>
                <div id="stepper" class="relative"></div>
            </div>
        </div>

        <!-- Order Details -->
        <div class="lg:col-span-5 flex flex-col gap-4">
            <div class="bg-surface rounded-2xl p-6 border border-outline">
                <h3 class="font-bold flex items-center gap-2 mb-5">
                    <span class="material-symbols-outlined text-primary">receipt_long</span>
                    Order Details
                </h3>
                <p class="text-sm text-secondary-text mb-3" id="restaurantName"></p>
                <div id="itemsList" class="space-y-3 mb-4"></div>
                <div class="border-t border-outline pt-4 flex justify-between items-center">
                    <span class="font-black text-on-surface">Total Paid</span>
                    <span class="text-xl font-black text-primary" id="orderTotal">₹0</span>
                </div>
            </div>

            <!-- Restaurant contact -->
            <div class="bg-surface rounded-2xl p-5 border border-outline" id="contactCard" style="display:none">
                <h4 class="font-bold text-sm mb-2 flex items-center gap-2">
                    <span class="material-symbols-outlined text-primary text-base">call</span>
                    Restaurant Contact
                </h4>
                <p class="text-sm text-secondary-text" id="contactPhone"></p>
            </div>

            <!-- Rejected Banner -->
            <div id="rejectedBanner" class="hidden bg-red-50 border border-red-200 rounded-2xl p-6 text-center">
                <span class="material-symbols-outlined text-error-red text-5xl block mb-2">cancel</span>
                <p class="font-bold text-error-red text-lg mb-1">Order Rejected</p>
                <p class="text-sm text-secondary-text mb-4">The restaurant was unable to accept your order.</p>
                <button onclick="window.location.href='dash.html'"
                    class="kinetic-gradient text-white font-bold px-6 py-2 rounded-xl text-sm">Order Again</button>
            </div>
        </div>
    </div>
</main>

<!-- Bottom Nav -->
<nav class="md:hidden fixed bottom-0 left-0 w-full flex justify-around items-center pb-6 pt-3 px-4 bg-white border-t border-outline z-50">
    <a href="dash.html" class="flex flex-col items-center text-secondary-text">
        <span class="material-symbols-outlined text-xl">explore</span>
        <span class="text-[10px] font-bold mt-1 uppercase">Explore</span>
    </a>
    <a href="orders.html" class="flex flex-col items-center text-primary">
        <span class="material-symbols-outlined filled text-xl">receipt_long</span>
        <span class="text-[10px] font-bold mt-1 uppercase">Orders</span>
    </a>
    <a href="user.html" class="flex flex-col items-center text-secondary-text">
        <span class="material-symbols-outlined text-xl">person</span>
        <span class="text-[10px] font-bold mt-1 uppercase">Account</span>
    </a>
</nav>

<script>
const API = 'http://127.0.0.1:5000';
if (localStorage.getItem('darkMode') === '1') document.getElementById('htmlRoot').classList.add('dark');

const role = localStorage.getItem('user_role');
if (!role || !['student','faculty'].includes(role)) window.location.href = 'login.html';

const params = new URLSearchParams(window.location.search);
const orderId = params.get('id');
const studentId = localStorage.getItem('user_id');

if (!orderId) window.location.href = 'dash.html';

const STEPS = [
    { key: 'pending',   label: 'Order Placed',    sub: 'Waiting for restaurant to confirm', icon: 'hourglass_empty' },
    { key: 'accepted',  label: 'Accepted',         sub: 'Restaurant confirmed your order',   icon: 'check_circle' },
    { key: 'preparing', label: 'Preparing',        sub: 'Chefs are crafting your meal',      icon: 'cooking' },
    { key: 'ready',     label: 'Ready',            sub: 'Your order is ready!',              icon: 'restaurant' },
    { key: 'completed', label: 'Completed',        sub: 'Enjoy your meal! 🎉',               icon: 'home' },
];

function renderStepper(currentStatus) {
    const currentIdx = STEPS.findIndex(s => s.key === currentStatus);
    document.getElementById('stepper').innerHTML = STEPS.map((step, i) => {
        const isDone = i < currentIdx;
        const isActive = i === currentIdx;
        const cls = isDone ? 'step-done' : isActive ? 'step-active' : '';
        return `
        <div class="relative flex items-start gap-5 pb-8 last:pb-0 ${cls}">
            ${i < STEPS.length - 1 ? `<div class="step-line absolute left-4 top-8 bottom-0 w-0.5 bg-outline"></div>` : ''}
            <div class="step-dot w-8 h-8 rounded-full bg-surface-container flex items-center justify-center relative z-10 flex-shrink-0 transition-all duration-300">
                <span class="icon material-symbols-outlined text-sm text-secondary-text">${isDone ? 'check' : step.icon}</span>
            </div>
            <div class="pt-1">
                <p class="step-label text-sm font-semibold text-secondary-text transition-all">${step.label}</p>
                <p class="text-xs text-secondary-text/60 mt-0.5">${step.sub}</p>
            </div>
        </div>`;
    }).join('');
}

let pollInterval;

async function fetchOrder() {
    if (!orderId) return;
    try {
        const res = await fetch(`${API}/order/track/${orderId}?student_id=${studentId}`);
        const data = await res.json();

        if (!data.success) {
            document.getElementById('orderTitle').textContent = 'Order not found';
            return;
        }

        const order = data.data;
        document.getElementById('orderTitle').textContent = `Order #${order.order_id}`;
        document.getElementById('restaurantName').textContent = order.restaurant_name || '';

        // Contact info
        if (order.restaurant_phone) {
            document.getElementById('contactCard').style.display = 'block';
            document.getElementById('contactPhone').textContent = order.restaurant_phone;
        }

        // Rejected
        if (order.status === 'rejected') {
            document.getElementById('etaBlock').style.display = 'none';
            document.getElementById('rejectedBanner').classList.remove('hidden');
            renderStepper('rejected');
            clearInterval(pollInterval);
            return;
        }

        renderStepper(order.status);

        // ETA
        if (order.estimated_time) {
            document.getElementById('etaValue').textContent = `~${order.estimated_time} mins`;
        } else if (order.status === 'pending') {
            document.getElementById('etaValue').textContent = 'Awaiting confirmation';
        }

        // Items
        if (order.items && order.items.length) {
            document.getElementById('itemsList').innerHTML = order.items.map(item => `
                <div class="flex justify-between items-center text-sm">
                    <span class="text-secondary-text">${item.quantity}x ${item.name}</span>
                    <span class="font-semibold">₹${(item.price * item.quantity).toFixed(0)}</span>
                </div>`).join('');
        }

        document.getElementById('orderTotal').textContent = `₹${parseFloat(order.total_price).toFixed(0)}`;

        if (order.status === 'completed') clearInterval(pollInterval);

    } catch (err) {
        console.error('Tracking error:', err);
    }
}

// Start tracking
renderStepper('pending');
fetchOrder();
pollInterval = setInterval(fetchOrder, 5000);
</script>
</body>
</html>
