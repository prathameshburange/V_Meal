<!DOCTYPE html>
<html class="light" lang="en" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support | V Meal</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = { theme: { extend: { colors: {
            "primary": "#FC8019", "background": "#f9f9f9", "surface": "#ffffff",
            "surface-low": "#f3f3f4", "outline": "#E9E9EB",
            "secondary-text": "#686B78", "success": "#60B246", "error-red": "#D83C3C",
        }}}}
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .kinetic-gradient { background: linear-gradient(135deg, #984800 0%, #FC8019 100%); }
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-background text-gray-800 pb-24">

<header class="fixed top-0 w-full z-50 bg-white border-b border-outline">
    <div class="flex justify-between items-center px-6 py-4 max-w-7xl mx-auto">
        <div class="flex items-center gap-3">
            <button onclick="window.location.href='dash.html'" class="p-2 rounded-full hover:bg-surface-low">
                <span class="material-symbols-outlined">arrow_back</span>
            </button>
            <img src="1766987781692.png" class="h-7" alt="V Meal"/>
        </div>
    </div>
</header>

<main class="pt-24 px-4 max-w-2xl mx-auto">
    <div class="mb-8">
        <h1 class="text-2xl font-extrabold mb-1">Customer Support</h1>
        <p class="text-secondary-text text-sm">Raise a ticket and we'll get back to you.</p>
    </div>

    <!-- Raise Ticket -->
    <div class="bg-white border border-outline rounded-2xl p-6 mb-8">
        <h2 class="font-bold text-lg mb-5">Raise a Ticket</h2>
        <form id="ticketForm" class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-widest text-secondary-text mb-2">Subject</label>
                <input type="text" id="ticketSubject" placeholder="e.g. Order not delivered"
                    class="w-full px-4 py-3 border border-outline rounded-xl bg-surface-low text-sm outline-none focus:border-primary transition-all" required/>
            </div>
            <div>
                <label class="block text-xs font-bold uppercase tracking-widest text-secondary-text mb-2">Message</label>
                <textarea id="ticketMessage" rows="4" placeholder="Describe your issue in detail..."
                    class="w-full px-4 py-3 border border-outline rounded-xl bg-surface-low text-sm outline-none focus:border-primary transition-all resize-none" required></textarea>
            </div>
            <button type="submit" class="kinetic-gradient text-white font-bold px-8 py-3 rounded-xl hover:opacity-90 transition-all flex items-center gap-2">
                Submit Ticket
                <span class="material-symbols-outlined text-lg">send</span>
            </button>
        </form>
    </div>

    <!-- My Tickets -->
    <div>
        <h2 class="font-bold text-lg mb-4">My Tickets</h2>
        <div id="ticketsList" class="space-y-4">
            <p class="text-secondary-text text-sm">Loading...</p>
        </div>
    </div>
</main>

<nav class="md:hidden fixed bottom-0 left-0 w-full flex justify-around items-center pb-6 pt-3 px-4 bg-white border-t border-outline z-50">
    <a href="dash.html" class="flex flex-col items-center text-secondary-text">
        <span class="material-symbols-outlined text-xl">explore</span>
        <span class="text-[10px] font-bold mt-1 uppercase">Explore</span>
    </a>
    <a href="orders.html" class="flex flex-col items-center text-secondary-text">
        <span class="material-symbols-outlined text-xl">receipt_long</span>
        <span class="text-[10px] font-bold mt-1 uppercase">Orders</span>
    </a>
    <a href="support.html" class="flex flex-col items-center text-primary">
        <span class="material-symbols-outlined text-xl" style="font-variation-settings:'FILL' 1">support_agent</span>
        <span class="text-[10px] font-bold mt-1 uppercase">Support</span>
    </a>
</nav>

<script>
const API = 'https://v-meal.onrender.com';
const userId = localStorage.getItem('user_id');
const role = localStorage.getItem('user_role');
if (!role || !['student','faculty'].includes(role)) window.location.href = 'login.html';

function showToast(msg, type='info') {
    const existing = document.querySelector('.vmeal-toast');
    if (existing) existing.remove();
    const colors = { success:'#60B246', error:'#D83C3C', info:'#FC8019' };
    const t = document.createElement('div');
    t.className = 'vmeal-toast';
    t.textContent = msg;
    t.style.cssText = `position:fixed;bottom:24px;right:24px;background:${colors[type]};color:white;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;z-index:99999;opacity:1;transition:opacity 0.4s;max-width:320px;box-shadow:0 4px 16px rgba(0,0,0,0.15);font-family:'Inter',sans-serif;`;
    document.body.appendChild(t);
    setTimeout(() => { t.style.opacity='0'; }, 2600);
    setTimeout(() => { t.remove(); }, 3000);
}

document.getElementById('ticketForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const subject = document.getElementById('ticketSubject').value.trim();
    const message = document.getElementById('ticketMessage').value.trim();
    try {
        const res = await fetch(`${API}/support/raise`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id: parseInt(userId), subject, message })
        });
        const data = await res.json();
        if (data.success) {
            showToast('Ticket raised!', 'success');
            document.getElementById('ticketForm').reset();
            fetchTickets();
        } else {
            showToast(data.message, 'error');
        }
    } catch { showToast('Server error', 'error'); }
});

async function fetchTickets() {
    try {
        const res = await fetch(`${API}/support/my-tickets/${userId}`);
        const data = await res.json();
        const list = document.getElementById('ticketsList');
        if (!data.success || !data.data.length) {
            list.innerHTML = `<p class="text-secondary-text text-sm border border-dashed border-outline rounded-2xl p-8 text-center">No tickets yet.</p>`;
            return;
        }
        const statusColor = { open: 'bg-orange-100 text-orange-600', responded: 'bg-blue-100 text-blue-600', closed: 'bg-gray-100 text-gray-500' };
        list.innerHTML = data.data.map(t => `
        <div class="bg-white border border-outline rounded-2xl p-5">
            <div class="flex justify-between items-start mb-2">
                <h4 class="font-bold text-sm">${t.subject}</h4>
                <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded-full ${statusColor[t.status] || 'bg-gray-100 text-gray-500'}">${t.status}</span>
            </div>
            <p class="text-sm text-secondary-text mb-3">${t.message}</p>
            ${t.admin_response ? `
            <div class="bg-blue-50 border border-blue-200 rounded-xl p-3 mt-3">
                <p class="text-xs font-bold text-blue-600 mb-1">Admin Response:</p>
                <p class="text-sm text-blue-800">${t.admin_response}</p>
            </div>` : ''}
            <p class="text-xs text-secondary-text/60 mt-3">${new Date(t.created_at).toLocaleDateString('en-IN', {day:'numeric',month:'short',year:'numeric'})}</p>
        </div>`).join('');
    } catch {}
}

fetchTickets();
</script>
</body>
</html>
