<!DOCTYPE html>
<html class="light" lang="en" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | V Meal</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = { theme: { extend: { colors: {
            "primary":"#FC8019","background":"#f9f9f9","surface":"#ffffff",
            "surface-container":"#eeeeee","on-surface":"#1a1c1c",
            "outline":"#E9E9EB","secondary-text":"#686B78",
            "success":"#60B246","error-red":"#D83C3C",
        }}}}
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .filled { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-background text-on-surface pb-24">

<header class="fixed top-0 w-full z-50 bg-white border-b border-outline">
    <div class="flex justify-between items-center px-6 py-4 max-w-7xl mx-auto">
        <div class="flex items-center gap-3">
            <button onclick="window.location.href='dash.html'" class="p-2 rounded-full hover:bg-surface-container transition-colors">
                <span class="material-symbols-outlined">arrow_back</span>
            </button>
            <img src="1766987781692.png" class="h-7 w-auto" alt="V Meal"/>
        </div>
    </div>
</header>

<main class="pt-24 px-4 max-w-2xl mx-auto">
    <h1 class="text-2xl font-black mb-6">My Orders</h1>

    <!-- Status filter -->
    <div class="flex gap-2 mb-6 overflow-x-auto pb-1">
        <button onclick="filterOrders('')" class="order-filter flex-none px-4 py-2 rounded-xl text-sm font-bold bg-primary text-white" data-status="">All</button>
        <button onclick="filterOrders('pending')" class="order-filter flex-none px-4 py-2 rounded-xl text-sm font-bold border border-outline text-secondary-text hover:bg-surface" data-status="pending">Pending</button>
        <button onclick="filterOrders('preparing')" class="order-filter flex-none px-4 py-2 rounded-xl text-sm font-bold border border-outline text-secondary-text hover:bg-surface" data-status="preparing">Preparing</button>
        <button onclick="filterOrders('completed')" class="order-filter flex-none px-4 py-2 rounded-xl text-sm font-bold border border-outline text-secondary-text hover:bg-surface" data-status="completed">Completed</button>
        <button onclick="filterOrders('rejected')" class="order-filter flex-none px-4 py-2 rounded-xl text-sm font-bold border border-outline text-secondary-text hover:bg-surface" data-status="rejected">Rejected</button>
    </div>

    <div id="ordersList" class="space-y-3">
        <div class="text-center py-12 text-secondary-text">Loading...</div>
    </div>
</main>

<nav class="md:hidden fixed bottom-0 left-0 w-full flex justify-around items-center pb-6 pt-3 px-4 bg-white border-t border-outline z-50">
    <a href="dash.html" class="flex flex-col items-center text-secondary-text">
        <span class="material-symbols-outlined text-xl">explore</span>
        <span class="text-[10px] font-bold mt-1 uppercase">Explore</span>
    </a>
    <a href="orders.html" class="flex flex-col items-center text-primary">
        <span class="material-symbols-outlined filled text-xl">receipt_long</span>
        <span class="text-[10px] font-bold mt-1 uppercase">Orders</span>
    </a>
    <a href="user.html" class="flex flex-col items-center text-secondary-text">
        <span class="material-symbols-outlined text-xl">person</span>
        <span class="text-[10px] font-bold mt-1 uppercase">Account</span>
    </a>
</nav>

<script>
const API = 'https://v-meal.onrender.com';
const role = localStorage.getItem('user_role');
if (!role || !['student','faculty'].includes(role)) window.location.href = 'login.html';
const userId = localStorage.getItem('user_id');

let allOrders = [];
let currentFilter = '';

async function fetchAllOrders() {
    try {
        const res = await fetch(`${API}/orders/${userId}`);
        const data = await res.json();
        if (data.success) {
            allOrders = data.data;
            renderOrders(allOrders);
        }
    } catch {}
}

function filterOrders(status) {
    currentFilter = status;
    document.querySelectorAll('.order-filter').forEach(btn => {
        const isActive = btn.dataset.status === status;
        btn.classList.toggle('bg-primary', isActive);
        btn.classList.toggle('text-white', isActive);
        btn.classList.toggle('text-secondary-text', !isActive);
        btn.classList.toggle('border-outline', !isActive);
    });
    const filtered = status ? allOrders.filter(o => o.status === status) : allOrders;
    renderOrders(filtered);
}

function renderOrders(orders) {
    const list = document.getElementById('ordersList');
    if (!orders.length) {
        list.innerHTML = `<div class="text-center py-12 text-secondary-text border-2 border-dashed border-outline rounded-2xl">No orders found.</div>`;
        return;
    }

    const statusColor = {
        pending: 'bg-orange-100 text-orange-600',
        accepted: 'bg-blue-100 text-blue-600',
        preparing: 'bg-yellow-100 text-yellow-700',
        ready: 'bg-purple-100 text-purple-600',
        completed: 'bg-green-100 text-green-700',
        rejected: 'bg-red-100 text-red-600'
    };

    const borderColor = {
        pending: 'border-l-orange-400',
        accepted: 'border-l-blue-400',
        preparing: 'border-l-yellow-400',
        ready: 'border-l-purple-400',
        completed: 'border-l-success',
        rejected: 'border-l-error-red'
    };

    list.innerHTML = orders.map(o => `
    <div class="bg-white border border-outline border-l-4 ${borderColor[o.status] || 'border-l-primary'} rounded-2xl p-5 cursor-pointer hover:shadow-sm transition-all"
        onclick="window.location.href='order_tracking.html?id=${o.order_id}'">
        <div class="flex justify-between items-start">
            <div class="flex-1">
                <div class="flex items-center gap-2 mb-1.5 flex-wrap">
                    <span class="text-xs font-black text-secondary-text">#${o.order_id}</span>
                    <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded-full ${statusColor[o.status] || 'bg-gray-100 text-gray-500'}">${o.status}</span>
                    ${o.cart_session ? `<span class="text-[10px] font-bold text-secondary-text">Session: ${o.cart_session}</span>` : ''}
                </div>
                <h4 class="font-bold text-base">${o.restaurant_name}</h4>
                <p class="text-xs text-secondary-text mt-0.5">${new Date(o.created_at).toLocaleDateString('en-IN', {day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</p>
                ${o.estimated_time ? `<p class="text-xs text-primary font-semibold mt-1">⏱ Est. ${o.estimated_time} mins</p>` : ''}
            </div>
            <div class="text-right ml-4 flex-shrink-0">
                <p class="font-black text-primary text-xl">₹${parseFloat(o.total_price).toFixed(0)}</p>
                <p class="text-xs text-secondary-text flex items-center gap-1 justify-end mt-1">
                    Track <span class="material-symbols-outlined text-xs">arrow_forward</span>
                </p>
            </div>
        </div>
    </div>`).join('');
}

fetchAllOrders();
</script>
</body>
</html>
